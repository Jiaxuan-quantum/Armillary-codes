name: Reference implementation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[relay,test]"
      - run: python -m pytest -q
      - run: armillary benchmark

  hardware-layouts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2"
      - run: python hardware_layouts/reproduce.py --out results/layouts
