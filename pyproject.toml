[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armillary-codes"
version = "0.1.0"
description = "Reproducible Armillary quantum LDPC codes, memory circuits, and decoding"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Jiaxuan Zhang"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "stim>=1.15,<2"]

[project.optional-dependencies]
relay = ["relay-bp==0.2.2"]
copt = ["coptpy>=8.0.7,<9"]
test = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[project.scripts]
armillary = "armillary.cli:main"

[project.urls]
Repository = "https://github.com/Jiaxuan-quantum/Armillary-codes"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
armillary = ["data/*.json", "data/candidates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
